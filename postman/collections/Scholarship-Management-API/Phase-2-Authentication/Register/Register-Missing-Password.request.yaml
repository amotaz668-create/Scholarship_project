$kind: http-request
name: 'Register - Missing Password'
order: 5000
method: POST
url: '{{baseUrl}}/api/auth/register'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "missing@test.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function() {
        pm.response.to.have.status(400);
      });
