$kind: http-request
name: 'Verify Scholarship Deleted (404)'
order: 2000
method: GET
url: '{{baseUrl}}/api/scholarships/{{scholarshipId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 404", function() {
        pm.response.to.have.status(404);
      });
