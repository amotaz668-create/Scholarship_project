$kind: http-request
name: 'Admin Token on Employee Route (403 - admin was registered as student)'
order: 6000
method: DELETE
url: '{{baseUrl}}/api/categories/{{categoryId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{adminToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403 (admin was blocked to student role at registration)", function() {
        pm.response.to.have.status(403);
      });
