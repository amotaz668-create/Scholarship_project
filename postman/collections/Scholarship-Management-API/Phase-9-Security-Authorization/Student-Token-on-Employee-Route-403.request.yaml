$kind: http-request
name: 'Student Token on Employee Route (403)'
order: 4000
method: POST
url: '{{baseUrl}}/api/categories'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{studentToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403", function() {
        pm.response.to.have.status(403);
      });
