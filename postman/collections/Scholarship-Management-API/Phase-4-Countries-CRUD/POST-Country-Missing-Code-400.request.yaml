$kind: http-request
name: 'POST Country - Missing Code (400)'
order: 7000
method: POST
url: '{{baseUrl}}/api/countries'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Germany"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function() {
        pm.response.to.have.status(400);
      });
