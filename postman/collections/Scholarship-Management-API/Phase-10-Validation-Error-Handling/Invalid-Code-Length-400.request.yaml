$kind: http-request
name: 'Invalid Code Length (400)'
order: 3000
method: POST
url: '{{baseUrl}}/api/countries'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "TestCountry",
      "code": "TOOLONG"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 400", function() {
        pm.response.to.have.status(400);
      });
