$kind: http-request
name: Pagination beyond results
order: 6000
method: GET
url: '{{baseUrl}}/api/scholarships'
queryParams:
  - key: page
    value: '999'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Data array is empty or has fewer items", function() {
        const json = pm.response.json();
        pm.expect(json.data).to.be.an("array");
      });
