$kind: http-request
name: Combined Filters
order: 7000
method: GET
url: '{{baseUrl}}/api/scholarships'
queryParams:
  - key: status
    value: published
  - key: fundingType
    value: Full
  - key: page
    value: '1'
  - key: limit
    value: '10'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
