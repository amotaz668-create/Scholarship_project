$kind: http-request
name: 'POST Create Category - Invalid Token (401)'
order: 8000
method: POST
url: '{{baseUrl}}/api/categories'
auth:
  type: bearer
  credentials:
    - key: token
      value: invalidtoken123
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 401", function() {
        pm.response.to.have.status(401);
      });
