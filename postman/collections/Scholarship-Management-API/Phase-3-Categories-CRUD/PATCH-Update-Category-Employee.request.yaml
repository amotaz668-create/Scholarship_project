$kind: http-request
name: 'PATCH Update Category (Employee)'
order: 4000
method: PATCH
url: '{{baseUrl}}/api/categories/{{categoryId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Engineering Updated",
      "description": "Updated description"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Name is updated", function() {
        const json = pm.response.json();
        pm.expect(json.data.name).to.equal("Engineering Updated");
      });
