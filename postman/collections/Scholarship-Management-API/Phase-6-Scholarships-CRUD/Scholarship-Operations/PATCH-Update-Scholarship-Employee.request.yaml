$kind: http-request
name: 'PATCH Update Scholarship (Employee)'
order: 4000
method: PATCH
url: '{{baseUrl}}/api/scholarships/{{scholarshipId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "STEM Excellence Award Updated",
      "status": "published"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Title is updated", function() {
        const json = pm.response.json();
        pm.expect(json.data.title).to.equal("STEM Excellence Award Updated");
      });
