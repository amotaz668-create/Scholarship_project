$kind: http-request
name: 'Setup: Create University for Scholarship'
order: 3000
method: POST
url: '{{baseUrl}}/api/universities'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "MIT",
      "country": "United States",
      "city": "Cambridge",
      "website": "https://mit.edu"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json.data && json.data._id) {
        pm.environment.set("universityId", json.data._id);
      }
