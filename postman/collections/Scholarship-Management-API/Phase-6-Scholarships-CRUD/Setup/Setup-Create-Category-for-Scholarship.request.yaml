$kind: http-request
name: 'Setup: Create Category for Scholarship'
order: 1000
method: POST
url: '{{baseUrl}}/api/categories'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "STEM",
      "description": "Science scholarships"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json.data && json.data._id) {
        pm.environment.set("categoryId", json.data._id);
      }
