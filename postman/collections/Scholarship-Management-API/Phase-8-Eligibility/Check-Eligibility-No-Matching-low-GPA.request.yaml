$kind: http-request
name: 'Check Eligibility - No Matching (low GPA)'
order: 2000
method: POST
url: '{{baseUrl}}/api/scholarships/check-eligibility'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "GPA": 1.0,
      "nationality": "United States",
      "degree": "Bachelor",
      "field": "Computer Science",
      "age": 22,
      "gender": "Male"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Data is array (may be empty)", function() {
        const json = pm.response.json();
        pm.expect(json.data).to.be.an("array");
      });
