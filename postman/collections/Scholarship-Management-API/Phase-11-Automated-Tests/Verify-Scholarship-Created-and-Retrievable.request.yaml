$kind: http-request
name: Verify Scholarship Created and Retrievable
order: 1000
method: GET
url: '{{baseUrl}}/api/scholarships/{{scholarshipId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
      pm.test("Returned scholarship matches saved scholarshipId", function() {
        const json = pm.response.json();
        pm.expect(json.data._id).to.equal(pm.environment.get("scholarshipId"));
      });
