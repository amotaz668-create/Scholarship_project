$kind: http-request
name: 'POST Create University (Employee)'
order: 2000
method: POST
url: '{{baseUrl}}/api/universities'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Cairo University",
      "country": "Egypt",
      "city": "Cairo",
      "website": "https://cu.edu.eg"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201", function() {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json.data && json.data._id) {
        pm.environment.set("universityId", json.data._id);
      }
