$kind: http-request
name: 'POST University - Student Token (403)'
order: 6000
method: POST
url: '{{baseUrl}}/api/universities'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{studentToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Test Uni",
      "country": "Egypt",
      "city": "Cairo"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 403", function() {
        pm.response.to.have.status(403);
      });
