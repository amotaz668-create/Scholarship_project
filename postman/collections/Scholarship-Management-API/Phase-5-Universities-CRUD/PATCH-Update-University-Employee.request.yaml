$kind: http-request
name: 'PATCH Update University (Employee)'
order: 4000
method: PATCH
url: '{{baseUrl}}/api/universities/{{universityId}}'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{employeeToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Cairo University Updated",
      "country": "Egypt",
      "city": "Cairo"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200", function() {
        pm.response.to.have.status(200);
      });
